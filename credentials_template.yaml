# The URL of your Canvas instance (e.g., https://your-school.instructure.com/)
API_URL: https://your-school.instructure.com/
# Your Canvas API token
API_KEY: a_long_string_of_characters
# Your Canvas User ID
USER_ID: 012345

# Cookies - Use when API_KEY is not available.
# Note - uncheck "Show URL-decoded" when copying
COOKIES: 
  _csrf_token: a_long_string_of_characters
  canvas_session: a_long_string_of_characters
  log_session_id: a_long_string_of_characters

# (Optional) A list of course IDs to archive.
# If unused, program will archive all courses under the user
# (minus COURSES_TO_SKIP, if applicable)
COURSE_SELECTION:
  # - 12345
  # - 67890

# (Optional) A list of course IDs to skip
COURSES_TO_SKIP:
#   - 12345
#   - 67890

# Size threshold for file downloads. 
# -1 = no limit (default)
# 0 = don't download any files (archiver will still save file's JSON metadata)
# Any positive integer (interpreted as bytes) or human-readable file size string
# (e.g. 2 GB, 500mb, etc) will act as an upper size limit on files
# that will be downloaded.
# - Note that files can be downloaded at a later time using the JSON metadata
# - - (implementation in progress in file_migrate.py)
FILE_SIZE_THRESH: -1

# True = program will overwrite an existing json with an updated json
# False = program will only write jsons that don't exist yet (default)
OVERWRITE_CONFIG:
  # top level
  courses_by_terms: FALSE
  # per course
  course_level:
    course: FALSE
    files: FALSE
    pages: FALSE
    assignments: FALSE
    discussion_topics: FALSE
    modules: FALSE
    module_items: FALSE

# If true, loads previously archived data (to avoid re-requesting data)
# default is True
LOAD_FROM_JSON: TRUE